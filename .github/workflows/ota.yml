name: Android OTA
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'assets/**'
      - 'index.ts'
      - 'package*.json'
      - 'app.config.ts'
      - 'release.config.json'
      - 'eas.json'
      - 'plugins/**'
      - '.github/workflows/ota.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        type: choice
        options: [production, preview]
        default: production
permissions:
  contents: read
concurrency:
  group: ota-${{ github.event.inputs.channel || 'production' }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.channel) || '["preview","production"]') }}
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_UPDATES_CHANNEL: ${{ matrix.channel }}
      STUDYSPACE_ALLOW_HTTP: ${{ matrix.channel == 'preview' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Validate OTA publishing configuration
        id: configuration
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            npm run ota:check
          else
            npm run ota:check -- --optional
          fi
      - if: steps.configuration.outputs.enabled == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.configuration.outputs.enabled == 'true'
        run: npm run check
      - if: steps.configuration.outputs.enabled == 'true'
        run: npm test
      - if: steps.configuration.outputs.enabled == 'true'
        run: npm run test:api
      - uses: expo/expo-github-action@v8
        if: steps.configuration.outputs.enabled == 'true'
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish compatible Android update
        if: steps.configuration.outputs.enabled == 'true'
        run: eas update --channel "$EXPO_UPDATES_CHANNEL" --platform android --environment "$EXPO_UPDATES_CHANNEL" --message "GitHub ${GITHUB_SHA::7}" --non-interactive
      - name: Delivery summary
        if: steps.configuration.outputs.enabled == 'true'
        run: |
          echo '### Android OTA published' >> "$GITHUB_STEP_SUMMARY"
          echo 'Compatible installations download this update automatically. It applies on the next launch. A changed native fingerprint requires a new APK.' >> "$GITHUB_STEP_SUMMARY"
