name: Android APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      profile:
        description: Build and update channel
        type: choice
        options: [production, preview]
        default: production
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_UPDATES_CHANNEL: ${{ github.event.inputs.profile || 'production' }}
      STUDYSPACE_ALLOW_HTTP: ${{ github.event.inputs.profile == 'preview' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm run ota:check
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run test:api
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build signed APK on EAS
        run: eas build --platform android --profile "$EXPO_UPDATES_CHANNEL" --non-interactive --wait
